<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Application icon. Plain SVG (no mesh gradients), so any renderer draws it; regenerate the .png
     and .ico from it with Inkscape + ImageMagick. Colours are the app palette: SnAccentBrush,
     KnobPitchBrush and KnobFilterBrush on the dark card background. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262c33"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#FFD58A"/><stop offset="1" stop-color="#E0A23D" stop-opacity="0"/></radialGradient>
</defs>
<rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
<rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
<g fill="none" stroke-linecap="round">
  <circle cx="256" cy="256" r="172" stroke="#3D7EAA" stroke-width="30" stroke-dasharray="760 321" transform="rotate(-60 256 256)"/>
  <circle cx="256" cy="256" r="118" stroke="#9C7BE0" stroke-width="30" stroke-dasharray="500 241" transform="rotate(150 256 256)"/>
  <circle cx="256" cy="256" r="64" stroke="#E0A23D" stroke-width="30" stroke-dasharray="270 132" transform="rotate(20 256 256)"/>
</g>
<circle cx="256" cy="256" r="40" fill="url(#glow)"/>
<circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
